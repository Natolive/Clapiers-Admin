monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # Persiste les logs (>= warning, cf. DoctrineHandler) dans la table
            # `log` pour la page d'administration (SUPER_ADMIN).
            db:
                type: service
                id: App\Logger\DoctrineHandler
                process_psr_3_messages: true
                channels: ["!event", "!doctrine"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            # Aucune écriture en test : ni sortie PHPUnit polluée, ni ligne `log`
            # créée. Le DoctrineHandler n'est donc jamais exercé ici (couvert par
            # un test unitaire dédié).
            main:
                type: "null"

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            db:
                type: service
                id: App\Logger\DoctrineHandler
                process_psr_3_messages: true
                channels: ["!event", "!doctrine"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
