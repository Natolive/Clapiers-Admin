# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Bind the HelloAsso client interface to its real implementation
    App\Common\Service\HelloAsso\HelloAssoClientInterface: '@App\Common\Service\HelloAsso\HelloAssoClient'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # Logging is silenced in tests via a "null" Monolog handler
        # (config/packages/monolog.yaml, when@test) — negative tests
        # (403/422 assertions) must not flood the PHPUnit output, and the
        # Doctrine handler must never write log rows during tests.

        # Jamais de vrai appel Bunny Storage dans les tests : zone en mémoire.
        # Le vrai MemberMediaStorage reste sous test, seul le transport change.
        App\Tests\Support\Fake\FakeBunnyStorageClient:
            public: true

        App\Common\Service\MemberMediaStorage:
            # Redéfinir le service annule l'autowiring hérité de `App\` : le
            # remettre pour ne remplacer QUE le transport HTTP.
            autowire: true
            arguments:
                $httpClient: '@App\Tests\Support\Fake\FakeBunnyStorageClient'

        # Never hit the real HelloAsso API in tests: swap in a controllable fake.
        App\Tests\Support\Fake\FakeHelloAssoClient:
            public: true
        App\Common\Service\HelloAsso\HelloAssoClientInterface: '@App\Tests\Support\Fake\FakeHelloAssoClient'
