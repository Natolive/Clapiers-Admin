; Surcharges de production, en complément de php.ini-production.
;
; Les vraies limites d'upload sont portées par les contraintes Symfony des
; routes (5M pour le dépôt public d'inscription, 10M pour la médiathèque) :
; c'est elles qui doivent répondre, avec un message lisible. PHP doit donc
; rester au-dessus, sinon il rejette le fichier avant le validateur et renvoie
; « Allowed maximum size is 2097152 bytes » (son défaut de 2M).
upload_max_filesize = 20M
post_max_size = 30M
