name: CI PREPROD

on:
  push:
    branches: [ preprod ]

jobs:
  deploy:
    # Une workflow appelée ne reçoit que les permissions du job appelant, et
    # `permissions` absent ne propage rien : sans cette ligne, le job `badges`
    # de backend-tests.yml (contents: write) fait échouer la validation avant
    # même le premier run.
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      namespace: clapier-admin-preprod
      tag-prefix: preprod
      api-base: https://preprod.clapiersvb.fr/api
    secrets: inherit
